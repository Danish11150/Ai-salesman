{% block content %}

<div class="shops-wrapper">

    <h2 class="shops-title">Your Shops</h2>

    <div class="shops-actions">
        <a href="/create_shop" class="btn-primary">+ Create New Shop</a>
        <a href="/upload_inventory" class="btn-secondary">Upload Inventory</a>
    </div>

    <div class="shops-grid">

        {% for shop in shops %}
        <div class="shop-card">

            <div class="shop-icon">🏪</div>

            <h3 class="shop-title">{{ shop.name }}</h3>

            <p class="shop-info">
                <strong>Industry:</strong> {{ shop.industry }} <br>
                <strong>Plan:</strong> {{ shop.plan }}
            </p>

            <div class="shop-actions">
                <a href="/inventory?shop_id={{ shop.id }}" class="btn-primary">Open</a>
                <a href="/edit_shop?shop_id={{ shop.id }}" class="btn-warning">Edit</a>
                <a href="/delete_shop?shop_id={{ shop.id }}" class="btn-danger">Delete</a>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

{% endblock %}
