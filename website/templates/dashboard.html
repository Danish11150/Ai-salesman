{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="dashboard-wrapper">

    <h2 class="dash-title">Welcome to Your Dashboard</h2>

    <div class="dash-grid">

        <a href="/my_shops" class="dash-card">
            <div class="dash-icon">🏪</div>
            <h3>My Shops</h3>
            <p>Manage all your shops</p>
        </a>

        <a href="/create_shop" class="dash-card">
            <div class="dash-icon">➕</div>
            <h3>Create Shop</h3>
            <p>Add a new shop</p>
        </a>

        <a href="/upload_inventory" class="dash-card">
            <div class="dash-icon">📦</div>
            <h3>Upload Inventory</h3>
            <p>Upload products in bulk</p>
        </a>

        <a href="/subscription" class="dash-card">
            <div class="dash-icon">💳</div>
            <h3>Subscription</h3>
            <p>Upgrade your plan</p>
        </a>

    </div>

</div>

{% endblock %}
