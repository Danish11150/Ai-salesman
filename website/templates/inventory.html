<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>

    <link rel="stylesheet" href="{{ url_for('website.static', filename='style.css') }}">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .inventory-wrapper {
            margin-left: 260px; /* space for sidebar */
            padding: 40px;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-header h2 {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .upload-btn {
            background: #4CAF50;
            padding: 10px 18px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .upload-btn:hover {
            background: #45a049;
        }

        .inventory-card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .inventory-card h3 {
            margin-bottom: 15px;
            color: #444;
        }

        .placeholder-box {
            background: #f0f0f0;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            color: #777;
            font-size: 16px;
            border: 2px dashed #ccc;
        }
    </style>
</head>

<body>

    <div class="inventory-wrapper">

        <div class="inventory-header">
            <h2>Inventory Management</h2>
            <a href="/upload_inventory" class="upload-btn">Upload Inventory</a>
        </div>

        <div class="inventory-card">
            <h3>Your Inventory</h3>

            <div class="placeholder-box">
                Inventory items will appear here after uploading JSON file.
                <br><br>
                <small>(Phase‑2 auto‑loader will fill this section)</small>
            </div>
        </div>

    </div>

</body>
</html>
