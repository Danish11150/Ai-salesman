<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>

    <link rel="stylesheet" href="{{ url_for('website.static', filename='style.css') }}">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /* MAIN WRAPPER */
        .inventory-wrapper {
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        /* DESKTOP: Sidebar space */
        @media (min-width: 768px) {
            .inventory-wrapper {
                margin-left: 260px;
                padding: 40px;
            }
        }

        /* HEADER */
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .inventory-header h2 {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }

        /* BUTTON */
        .upload-btn {
            background: #4CAF50;
            padding: 10px 18px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .upload-btn:hover {
            background: #45a049;
        }

        /* CARD */
        .inventory-card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .inventory-card h3 {
            margin-bottom: 15px;
            color: #444;
        }

        /* PLACEHOLDER */
        .placeholder-box {
            background: #f0f0f0;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            color: #777;
            font-size: 16px;
            border: 2px dashed #ccc;
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 480px) {
            .inventory-header h2 {
                font-size: 22px;
            }

            .inventory-card {
                padding: 18px;
            }

            .placeholder-box {
                padding: 25px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="inventory-wrapper">

        <div class="inventory-header">
            <h2>Inventory Management</h2>
            <a href="/upload_inventory" class="upload-btn">Upload Inventory</a>
        </div>

        <div class="inventory-card">
            <h3>Your Inventory</h3>

            <div class="placeholder-box">
                Inventory items will appear here after uploading JSON file.
                <br><br>
                <small>(Phase‑2 auto‑loader will fill this section)</small>
            </div>
        </div>

    </div>

</body>
</html>
