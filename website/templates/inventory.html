{% extends "base.html" %}
{% block content %}

<div class="inventory-wrapper">

    <div class="inventory-header">
        <h2>Inventory</h2>

        <a href="/upload_inventory?shop_id={{ shop.id }}" class="btn-primary">
            + Upload More Items
        </a>
    </div>

    <div class="inventory-card">

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price ({{ shop.currency }})</th>
                    <th>Qty</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for item in inventory %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.price }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>
                        <a href="/edit_item?id={{ item.id }}" class="btn-secondary">Edit</a>
                        <a href="/delete_item?id={{ item.id }}" class="btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</div>

{% endblock %}
