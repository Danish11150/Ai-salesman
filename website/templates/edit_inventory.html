<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
        }

        input, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #0078D7;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>Edit Item</h2>

    <form action="/update_item" method="POST">

        <input type="hidden" name="item_id" value="{{ item.id }}">
        <input type="hidden" name="shop_id" value="{{ shop_id }}">

        <label>Name:</label>
        <input type="text" name="name" value="{{ item.name }}" required>

        <label>Category:</label>
        <input type="text" name="category" value="{{ item.category }}">

        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ item.price }}" required>

        <label>Stock Quantity:</label>
        <input type="number" name="stock_qty" value="{{ item.stock_qty }}" required>

        <button type="submit">Save</button>
    </form>

    <a class="back-link" href="/inventory?shop_id={{ shop_id }}">Back</a>

</body>
</html>
